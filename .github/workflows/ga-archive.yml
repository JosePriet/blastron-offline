name: ga-archive-search
on:
  workflow_dispatch:
    inputs:
      script:
        default: fetch2.py
      out:
        default: results2
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 ga-archive/${{ inputs.script }} ga-archive/${{ inputs.out }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ga-archive
          git commit -m "ga-archive: search results" || exit 0
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
