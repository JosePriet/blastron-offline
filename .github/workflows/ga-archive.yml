name: ga-archive-search
on:
  push:
    branches: [claude/project-thread-wv9u62]
    paths: [ga-archive/fetch.py, .github/workflows/ga-archive.yml]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 ga-archive/fetch.py ga-archive/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga-archive-results
          path: ga-archive/results
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ga-archive/results
          git commit -m "ga-archive: search results" || exit 0
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
